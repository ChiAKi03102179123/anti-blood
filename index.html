<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抗血 — 文字冒險</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #0a0a0f;
  --surface: #0f0f18;
  --panel: #13131f;
  --border: #1e1e30;
  --red: #c0392b;
  --red-dim: #7a1e14;
  --red-glow: rgba(192,57,43,0.15);
  --text: #d4cfc8;
  --text-dim: #6b6670;
  --text-bright: #ede8e0;
  --accent: #8b2fc9;
  --accent-glow: rgba(139,47,201,0.12);
  --mono: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--serif);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 80%, rgba(192,57,43,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 20%, rgba(139,47,201,0.05) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
  pointer-events: none;
  z-index: 1;
}
#app {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 720px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0 16px 40px;
}
#header { padding: 32px 0 24px; border-bottom: 1px solid var(--border); }
.title-main { font-family: var(--mono); font-size: 11px; letter-spacing: 0.3em; color: var(--red); text-transform: uppercase; margin-bottom: 6px; opacity: 0.8; }
.title-kanji { font-size: 32px; font-weight: 600; color: var(--text-bright); letter-spacing: 0.05em; line-height: 1; }
.title-sub { font-family: var(--mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.2em; margin-top: 8px; }
#status-bar { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.15em; flex-wrap: wrap; }
.status-item { display: flex; align-items: center; gap: 6px; }
.status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.status-value { color: var(--text); }
#chapter-select { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); padding: 6px 26px 6px 10px; cursor: pointer; outline: none; appearance: none; -webkit-appearance: none; border-radius: 999px; margin-left: auto; }
#chapter-select:hover, #chapter-select:focus { color: var(--text-bright); border-color: var(--red-dim); }
#chapter-select option { background: #0f0f18; color: var(--text); }
#scene-box { flex: 1; padding: 28px 0 0; }
.scene-header { font-family: var(--mono); font-size: 9px; letter-spacing: 0.35em; color: var(--red-dim); text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
.scene-header::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }
#narrative { min-height: 200px; }
.text-block { margin-bottom: 0; }
.text-block p { font-size: 15px; line-height: 2; color: var(--text); margin-bottom: 18px; opacity: 0; transform: translateY(6px); transition: opacity 0.5s ease, transform 0.5s ease; white-space: pre-wrap; }
.text-block p.visible { opacity: 1; transform: translateY(0); }
.text-block p.dialogue { color: var(--text-bright); padding-left: 16px; border-left: 2px solid var(--red-dim); }
.text-block p.inner { font-style: italic; color: #9090a0; font-size: 13px; }
.text-block p.system { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.1em; background: var(--accent-glow); padding: 10px 14px; border-left: 2px solid var(--accent); }
.text-block p.blood { color: var(--red); font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; background: var(--red-glow); padding: 10px 14px; border-left: 2px solid var(--red); }
.text-block p.yiyan { color: #c9a0ff; font-style: italic; font-size: 14px; padding: 12px 16px; background: var(--accent-glow); border-left: 2px solid var(--accent); position: relative; }
.text-block p.yiyan::before { content: '異炎'; font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; color: var(--accent); display: block; margin-bottom: 6px; }
#btn-area { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); min-height: 60px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn-continue { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--text-dim); background: none; border: 1px solid var(--border); padding: 10px 20px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; position: relative; overflow: hidden; }
.btn-continue::before { content: ''; position: absolute; inset: 0; background: var(--red-glow); transform: translateX(-100%); transition: transform 0.3s ease; z-index: -1; }
.btn-continue:hover { color: var(--text-bright); border-color: var(--red-dim); }
.btn-continue:hover::before { transform: translateX(0); }
.btn-continue.primary { color: var(--text-bright); border-color: var(--red-dim); }
.btn-continue.secondary { color: var(--text-dim); }
#progress-bar { width: 100%; height: 2px; background: var(--border); margin-top: 32px; position: relative; }
#progress-fill { height: 100%; background: linear-gradient(to right, var(--red-dim), var(--red)); transition: width 0.8s ease; }
.progress-label { font-family: var(--mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.2em; margin-top: 6px; text-align: right; }
#scene-box.fading { opacity: 0; transition: opacity 0.4s ease; }
#scene-box.visible { opacity: 1; transition: opacity 0.4s ease; }
@media (max-width: 480px) { .title-kanji { font-size: 26px; } .text-block p { font-size: 14px; } #status-bar { gap: 10px; } #chapter-select { margin-left: 0; max-width: 100%; } }

</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="title-main">— CHAPTER 01 —</div>
    <div class="title-kanji">抗　血</div>
    <div class="title-sub">ANTI-BLOOD &nbsp;/&nbsp; TEXT ADVENTURE</div>
  </div>

  <div id="status-bar">
    <div class="status-item">
      <div class="status-dot"></div>
      <span>角色</span>
      <span class="status-value" id="st-char">賀佳璃</span>
    </div>
    <div class="status-item">
      <span>種族</span>
      <span class="status-value" id="st-race">——</span>
    </div>
    <div class="status-item">
      <span>等級</span>
      <span class="status-value" id="st-grade">——</span>
    </div>
    <div class="status-item">
      <span id="st-day">疫苗後第 0 天</span>
    </div>
    <select id="chapter-select" onchange="jumpToChapter(this.value)">
      <option value="">☰ 章節跳轉</option>
    </select>
  </div>

  <div id="scene-box" class="visible">
    <div class="scene-header" id="scene-label">序 — 載入中</div>
    <div id="narrative" class="text-block"></div>
    <div id="btn-area"></div>
  </div>

  <div id="progress-bar">
    <div id="progress-fill" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progress-label">0 / 0</div>
</div>

        "type": "system",
        "text": "[ 目前比數：蒼元之境 > 南靜園 ]"
      },
      {
        "type": "normal",
        "text": "學園長倍感滿意，有種解氣的舒爽。大夥們士氣高漲，徹底將南靜園的傲氣給壓住了。"
      },
      {
        "type": "normal",
        "text": "難得一次讓南靜園吃虧的機會，怎麼能不高興？"
      },
      {
        "type": "normal",
        "text": "……雖然如此，台下的家長們可看得膽戰心驚，有不少人嚇得兩眼一翻，暈了過去。"
      },
      {
        "type": "system",
        "text": "[ 第八章　完 ]"
      }
    ],
    "next": null
  }
];
const CHAPTERS = [
  {
    "label": "第一章　不被世界承認的我",
    "sceneId": "intro"
  },
  {
    "label": "第二章　再見，舊的自己",
    "sceneId": "ch2_rebirth"
  },
  {
    "label": "第三章　吸血鬼的特權",
    "sceneId": "ch3_world"
  },
  {
    "label": "第四章　等待突破的時刻",
    "sceneId": "ch4_tense"
  },
  {
    "label": "第五章　吸血鬼 vs. 狼人",
    "sceneId": "ch5_arena"
  },
  {
    "label": "第六章　夥伴與過去",
    "sceneId": "ch6_wakeup"
  },
  {
    "label": "第七章　哭泣不會改變過去，拳頭才會",
    "sceneId": "ch7_calm"
  },
  {
    "label": "第八章　落井下石，我可是專業的",
    "sceneId": "ch8_stranger"
  }
];
let currentScene = 0;
let isAnimating = false;

const sceneLabel = document.getElementById('scene-label');
const narrative = document.getElementById('narrative');
const btnArea = document.getElementById('btn-area');
const progressFill = document.getElementById('progress-fill');
const progressLabel = document.getElementById('progress-label');
const stRace = document.getElementById('st-race');
const stGrade = document.getElementById('st-grade');
const stDay = document.getElementById('st-day');

function updateStatusBar(scene) {
  stRace.textContent = scene.race || '——';
  stGrade.textContent = scene.grade || '——';
  if (scene.day > 0) {
    stDay.textContent = `疫苗後第 ${scene.day} 天`;
  } else if (scene.day < 0) {
    stDay.textContent = `疫苗前 ${Math.abs(scene.day)} 天`;
  } else {
    stDay.textContent = '疫苗後第 0 天';
  }
}

function renderScene(idx) {
  const scene = SCENES[idx];
  if (!scene) return;

  const pct = SCENES.length > 1 ? Math.round((idx / (SCENES.length - 1)) * 100) : 0;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = `${idx + 1} / ${SCENES.length}`;
  sceneLabel.textContent = scene.label;
  updateStatusBar(scene);

  narrative.innerHTML = '';
  btnArea.innerHTML = '';

  scene.lines.forEach((line, i) => {
    const p = document.createElement('p');
    p.className = line.type || 'normal';
    p.textContent = line.text || '';
    narrative.appendChild(p);
    setTimeout(() => p.classList.add('visible'), 80 + i * 120);
  });

  const delay = 80 + scene.lines.length * 120 + 300;
  setTimeout(() => {
    if (scene.next) {
      const btn = document.createElement('button');
      btn.className = 'btn-continue primary';
      btn.textContent = '▶ 繼續';
      btn.onclick = () => {
        const nextIdx = SCENES.findIndex(s => s.id === scene.next);
        goTo(nextIdx !== -1 ? nextIdx : idx + 1);
      };
      btnArea.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn-continue primary';
      btn.textContent = '↩ 重新開始';
      btn.onclick = () => goTo(0);
      btnArea.appendChild(btn);
    }

    if (idx > 0) {
      const prev = document.createElement('button');
      prev.className = 'btn-continue secondary';
      prev.textContent = '← 上一幕';
      prev.onclick = () => goTo(idx - 1);
      btnArea.appendChild(prev);
    }
  }, delay);
}

function goTo(idx) {
  if (isAnimating || idx < 0 || idx >= SCENES.length) return;
  isAnimating = true;
  const box = document.getElementById('scene-box');
  box.classList.remove('visible');
  box.classList.add('fading');

  setTimeout(() => {
    currentScene = idx;
    renderScene(idx);
    box.classList.remove('fading');
    box.classList.add('visible');
    isAnimating = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 400);
}

function buildDropdown() {
  const sel = document.getElementById('chapter-select');
  CHAPTERS.forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch.sceneId;
    opt.textContent = ch.label;
    sel.appendChild(opt);
  });
}

function jumpToChapter(sceneId) {
  if (!sceneId) return;
  const idx = SCENES.findIndex(s => s.id === sceneId);
  if (idx !== -1) goTo(idx);
  document.getElementById('chapter-select').value = '';
}

window.jumpToChapter = jumpToChapter;
buildDropdown();
renderScene(0);

</script>
</body>
</html>
